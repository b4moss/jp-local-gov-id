# CI — PRs targeting develop or dev-* (app / library), plus push to main/release.
# main: Codecov default-branch freshness (#121).
# release: tag SHAs used by publish.yml get reusable CI success history.
# Docs PRs targeting doc-site use ci-docs.yml instead; this workflow does not run there.
# Local pre-PR gate: npm run ci:local (nektos/act). See docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches:
      - develop
      - "dev-*"
  push:
    branches:
      - main
      - release

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_heavy: ${{ steps.decide.outputs.skip_heavy }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide skip / docs-only / full
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isAct = process.env.ACT === 'true';
            if (isAct) {
              core.setOutput('skip_heavy', 'false');
              core.setOutput('reason', 'act');
              core.info('ACT=true: always run heavy jobs');
              return;
            }

            // App Test/Build is irrelevant for docs / documentation-site trees.
            // site/** is covered by Docs CI / Deploy Docs, not this workflow.
            const isAppCiSkippable = (p) =>
              p.startsWith('docs/') ||
              p.startsWith('site/') ||
              p.endsWith('.md') ||
              p === 'LICENSE' ||
              (p.startsWith('.github/') && p.endsWith('.md')) ||
              p === '.github/workflows/ci-docs.yml' ||
              p === '.github/workflows/deploy-docs.yml';

            const base = context.repo;
            const pr = context.payload.pull_request;
            let baseSha = null;
            let headSha = null;

            if (pr) {
              baseSha = pr.base.sha;
              headSha = pr.head.sha;
            } else if (context.eventName === 'push') {
              // Push to main/release: compare against the previous tip so
              // docs-only merges skip Test/Build (Codecov not needed).
              baseSha = context.payload.before;
              headSha = context.sha;
              if (!baseSha || /^0+$/.test(baseSha)) {
                core.setOutput('skip_heavy', 'false');
                core.setOutput('reason', 'full');
                core.info('No usable before SHA; running full CI');
                return;
              }
            } else {
              core.setOutput('skip_heavy', 'false');
              core.setOutput('reason', 'no-compare');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: base.owner,
              repo: base.repo,
              workflow_id: 'ci.yml',
              head_sha: headSha,
              status: 'completed',
              per_page: 30,
            });
            const priorSuccess = (runs.workflow_runs || []).some(
              (r) => r.conclusion === 'success' && String(r.id) !== String(context.runId),
            );
            if (priorSuccess) {
              core.setOutput('skip_heavy', 'true');
              core.setOutput('reason', 'sha-already-green');
              core.info(`Skip heavy jobs: CI already succeeded for ${headSha}`);
              return;
            }

            // Docs / site-only path filter via compare API (PR and push)
            const { data: comp } = await github.rest.repos.compareCommits({
              owner: base.owner,
              repo: base.repo,
              base: baseSha,
              head: headSha,
            });
            const files = comp.files || [];
            const isDocsOrSiteOnly =
              files.length > 0 && files.every((f) => isAppCiSkippable(f.filename));
            if (isDocsOrSiteOnly) {
              core.setOutput('skip_heavy', 'true');
              core.setOutput('reason', 'docs-only');
              core.info('Skip heavy jobs: docs/site-only change set');
              return;
            }

            core.setOutput('skip_heavy', 'false');
            core.setOutput('reason', 'full');

  # Single job keeps required check name "Test & Build" and runs npm ci once.
  # Always runs (even when skipping) so branch protection never sees a skipped check.
  test-and-build:
    name: Test & Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip heavy work
        if: needs.gate.outputs.skip_heavy == 'true'
        run: |
          echo "Heavy jobs skipped (${{ needs.gate.outputs.reason }}); treating as success."

      - name: Checkout
        if: needs.gate.outputs.skip_heavy != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: needs.gate.outputs.skip_heavy != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # App CI does not need the Nuxt site workspace.
      - name: Install dependencies (app workspaces)
        if: needs.gate.outputs.skip_heavy != 'true'
        run: >
          npm ci
          -w @b4moss/jp-local-gov-id
          -w @b4moss/jp-local-gov-id-data
          -w jp-local-gov-id-scripts
          --include-workspace-root

      - name: Test with coverage
        if: needs.gate.outputs.skip_heavy != 'true'
        run: npm test

      - name: Build
        if: needs.gate.outputs.skip_heavy != 'true'
        run: npm run build

      - name: Upload coverage to Codecov
        if: ${{ needs.gate.outputs.skip_heavy != 'true' && !env.ACT }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/jp-local-gov-id/coverage/lcov.info
          fail_ci_if_error: false
