# Docs CI — PRs targeting doc-site only.
# Builds the documentation site; does not run app tests or app package build as a gate.
# App CI (ci.yml) is intentionally out of scope for this branch.
name: Docs CI

on:
  pull_request:
    branches:
      - doc-site

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          NITRO_PRESET: static
        run: npm run build:site
